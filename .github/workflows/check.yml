name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check and test
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build Windows x64
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Get verified NSIS
        shell: pwsh
        run: ./scripts/get-nsis.ps1
      - name: Validate installer packaging
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
