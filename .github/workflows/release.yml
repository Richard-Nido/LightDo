name: Release Windows installer
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up pinned Rust
        run: rustup show
      - name: Verify version and local acceptance
        shell: pwsh
        run: ./scripts/release.ps1 -CheckOnly
      - name: Check and test
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Get verified NSIS
        shell: pwsh
        run: ./scripts/get-nsis.ps1
      - name: Build installer and checksum
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Silent installer smoke test
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lightdo-release
          if-no-files-found: error
          path: |
            dist/LightDo_*_x64-setup.exe
            dist/SHA256SUMS.txt
            dist/LightDo_*_licenses.zip
            dist/stage/THIRD_PARTY_DEPENDENCIES.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
  publish:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lightdo-release
          path: release-assets
      - name: Publish complete Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem release-assets -Recurse -File | Select-Object -ExpandProperty FullName)
          if (!($files | Where-Object { $_ -like '*_x64-setup.exe' })) { throw '缺少安装包' }
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --title "轻待 LightDo $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw '公开 Release 创建失败' }
