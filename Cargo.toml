[package]
name = "lightdo"
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Yuan Haoran (Richard-Nido)"]
description = "轻待 LightDo — 纯本地玻璃待办"

[build-dependencies]
embed-resource = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-numerics = "0.3"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Foundation", "Foundation_Metadata", "Graphics", "Graphics_Capture",
  "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Security_Authorization_AppCapabilityAccess",
  "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Performance",
  "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_RichEdit", "Win32_UI_HiDpi", "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
